<!DOCTYPE html>
<html>
<head>
  <title>LinkedIn AI Outreach Generator v2</title>
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label {
      font-weight: bold;
    }
    input[type="text"] {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .style-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .style-option {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }
    .style-option.selected {
      background-color: #0077b5;
      color: white;
    }
    button {
      padding: 10px;
      background-color: #0077b5;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005e93;
    }
    #result {
      margin-top: 15px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      min-height: 100px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>LinkedIn AI Outreach Generator</h2>
    
    <div class="input-group">
      <label for="keywords">Keywords to include:</label>
      <input type="text" id="keywords" placeholder="Enter keywords separated by commas">
    </div>

    <div class="input-group">
      <label>Message Style:</label>
      <div class="style-options">
        <div class="style-option" data-style="professional">Professional</div>
        <div class="style-option" data-style="friendly">Friendly</div>
        <div class="style-option" data-style="direct">Direct</div>
        <div class="style-option" data-style="enthusiastic">Enthusiastic</div>
      </div>
    </div>

    <button id="generate">Generate Message</button>
    
    <div id="result"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
